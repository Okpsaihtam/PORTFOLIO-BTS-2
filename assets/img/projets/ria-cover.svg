<title>Interface du chatbot RIA Check en conversation avec un utilisateur</title>
<rect width="1200" height="750" fill="#eef3f0"/>
<g><rect x="60" y="40" width="1080" height="670" rx="14" fill="#ffffff" stroke="#cbd5d1" stroke-width="1.5"/><path d="M60 54 a14 14 0 0 1 14 -14 h1052 a14 14 0 0 1 14 14 v30 h-1080 z" fill="#e5e7eb"/><circle cx="84" cy="62" r="6" fill="#ef4444"/><circle cx="104" cy="62" r="6" fill="#f59e0b"/><circle cx="124" cy="62" r="6" fill="#22c55e"/><rect x="160" y="50" width="880" height="24" rx="12" fill="#f9fafb"/><text x="600.0" y="67" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle">ria-check-go.onrender.com</text></g><svg x="61" y="84" width="1078" height="625" viewBox="0 0 1080 626"><rect x="0" y="0" width="1080" height="626" rx="0" fill="#f8fafc"/><rect x="0" y="0" width="1080" height="64" rx="0" fill="#0b3b60"/><circle cx="40" cy="32" r="18" fill="#38bdf8"/><text x="72" y="30" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="start">RIA Check</text><text x="72" y="50" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#bae6fd" text-anchor="start">Assistant d&#x27;évaluation d&#x27;applications web</text><rect x="631.6" y="100" width="408.4" height="48" rx="16" fill="#2563eb"/><text x="649.6" y="130" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#fff" text-anchor="start">Peux-tu évaluer https://demo-boutique.fr ?</text><circle cx="50" cy="196" r="16" fill="#38bdf8"/><rect x="76" y="172" width="592.4" height="48" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="94" y="202" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start">J&#x27;analyse l&#x27;architecture, les performances et l&#x27;accessibilité…</text><circle cx="50" cy="268" r="16" fill="#38bdf8"/><rect x="76" y="244" width="684.4" height="48" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="94" y="274" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start">Score global : 72 / 100. Point faible : images non compressées (2,4 Mo).</text><rect x="705.2" y="316" width="334.79999999999995" height="48" rx="16" fill="#2563eb"/><text x="723.2" y="346" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#fff" text-anchor="start">Que dois-je corriger en priorité ?</text><circle cx="50" cy="412" r="16" fill="#38bdf8"/><rect x="76" y="388" width="720" height="48" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="94" y="418" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#0f172a" text-anchor="start">1. Convertir les images en WebP  2. Ajouter des attributs alt  3. Différer le JavaScript</text><rect x="76" y="464" width="230" height="40" rx="20" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/><text x="191" y="490" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#075985" text-anchor="middle">Télécharger le rapport PDF</text><rect x="30" y="548" width="1020" height="54" rx="27" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="581" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="start">Posez votre question ou collez une URL…</text><circle cx="1020" cy="575" r="20" fill="#2563eb"/><path d="M1012 575 h14 m-6 -6 l6 6 -6 6" stroke="#fff" stroke-width="2.5" fill="none"/></svg>
</svg>