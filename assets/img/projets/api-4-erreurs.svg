" xml:space="preserve"><tspan fill="#7dd3fc">    &quot;message&quot;</tspan><tspan fill="#e2e8f0">:</tspan></text><text x="640" y="345" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="17" xml:space="preserve"><tspan fill="#86efac">      &quot;Validation failed&quot;</tspan><tspan fill="#e2e8f0">,</tspan></text><text x="640" y="379" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="17" xml:space="preserve"><tspan fill="#7dd3fc">    &quot;details&quot;</tspan><tspan fill="#e2e8f0">: [</tspan></text><text x="640" y="413" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="17" xml:space="preserve"><tspan fill="#86efac">      &quot;Le champ text</tspan></text><text x="640" y="447" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="17" xml:space="preserve"><tspan fill="#86efac">       est requis&quot;,</tspan></text><text x="640" y="481" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="17" xml:space="preserve"><tspan fill="#86efac">      &quot;author : 100</tspan></text><text x="640" y="515" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="17" xml:space="preserve"><tspan fill="#86efac">       caractères max&quot;</tspan></text><text x="640" y="549" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="17" xml:space="preserve"><tspan fill="#e2e8f0">    ]</tspan></text><text x="640" y="583" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="17" xml:space="preserve"><tspan fill="#e2e8f0">  }</tspan></text><text x="640" y="617" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="17" xml:space="preserve"><tspan fill="#e2e8f0">}</tspan></text>
