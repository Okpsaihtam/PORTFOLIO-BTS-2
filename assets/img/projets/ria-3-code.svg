<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Extrait de code Python de la route Flask /chat qui appelle le modèle de langage">
<title>Extrait de code Python de la route Flask /chat qui appelle le modèle de langage</title>
<rect width="1200" height="750" fill="#e8eeeb"/>
<g><rect x="60" y="40" width="1080" height="670" rx="14" fill="#0f172a" stroke="#cbd5d1" stroke-width="1.5"/><path d="M60 54 a14 14 0 0 1 14 -14 h1052 a14 14 0 0 1 14 14 v30 h-1080 z" fill="#1f2937"/><circle cx="84" cy="62" r="6" fill="#ef4444"/><circle cx="104" cy="62" r="6" fill="#f59e0b"/><circle cx="124" cy="62" r="6" fill="#22c55e"/><text x="600.0" y="67" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">app.py — route /chat</text></g><text x="110" y="125" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#475569" text-anchor="end">1</text><text x="110" y="159" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#475569" text-anchor="end">2</text><text x="110" y="193" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#475569" text-anchor="end">3</text><text x="110" y="227" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#475569" text-anchor="end">4</text><text x="110" y="261" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#475569" text-anchor="end">5</text><text x="110" y="295" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#475569" text-anchor="end">6</text><text x="110" y="329" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#475569" text-anchor="end">7</text><text x="110" y="363" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#475569" text-anchor="end">8</text><text x="110" y="397" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#475569" text-anchor="end">9</text><text x="110" y="431" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#475569" text-anchor="end">10</text><text x="110" y="465" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#475569" text-anchor="end">11</text><text x="110" y="499" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#475569" text-anchor="end">12</text><text x="110" y="533" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#475569" text-anchor="end">13</text><text x="110" y="567" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#475569" text-anchor="end">14</text><text x="110" y="601" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#475569" text-anchor="end">15</text><text x="110" y="635" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#475569" text-anchor="end">16</text><text x="130" y="125" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#c4b5fd">@app.post</tspan><tspan fill="#86efac">(&quot;/chat&quot;)</tspan></text><text x="130" y="159" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#c4b5fd">def </tspan><tspan fill="#7dd3fc">chat</tspan><tspan fill="#e2e8f0">():</tspan></text><text x="130" y="193" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0">    msg = request.json.get(</tspan><tspan fill="#86efac">&quot;message&quot;</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">&quot;&quot;</tspan><tspan fill="#e2e8f0">)[:</tspan><tspan fill="#fdba74">2000</tspan><tspan fill="#e2e8f0">]</tspan></text><text x="130" y="227" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0">    </tspan><tspan fill="#94a3b8"># Limiter la taille du message : moins de jetons, moins d&#x27;énergie</tspan></text><text x="130" y="261" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0">    url = extraire_url(msg)</tspan></text><text x="130" y="295" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0">    contexte = analyser_page(url) </tspan><tspan fill="#c4b5fd">if </tspan><tspan fill="#e2e8f0">url </tspan><tspan fill="#c4b5fd">else </tspan><tspan fill="#86efac">&quot;&quot;</tspan></text><text x="130" y="329" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0"></tspan></text><text x="130" y="363" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0">    reponse = client.chat.completions.create(</tspan></text><text x="130" y="397" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0">        model=MODELE,</tspan></text><text x="130" y="431" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0">        messages=[</tspan></text><text x="130" y="465" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0">            {</tspan><tspan fill="#86efac">&quot;role&quot;</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">&quot;system&quot;</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">&quot;content&quot;</tspan><tspan fill="#e2e8f0">: PROMPT_EVALUATION},</tspan></text><text x="130" y="499" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0">            {</tspan><tspan fill="#86efac">&quot;role&quot;</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">&quot;user&quot;</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">&quot;content&quot;</tspan><tspan fill="#e2e8f0">: contexte + msg},</tspan></text><text x="130" y="533" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0">        ],</tspan></text><text x="130" y="567" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0">        max_tokens=</tspan><tspan fill="#fdba74">600</tspan><tspan fill="#e2e8f0">,</tspan></text><text x="130" y="601" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0">    )</tspan></text><text x="130" y="635" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0">    </tspan><tspan fill="#c4b5fd">return </tspan><tspan fill="#e2e8f0">jsonify(reply=reponse.choices[</tspan><tspan fill="#fdba74">0</tspan><tspan fill="#e2e8f0">].message.content)</tspan></text>
</svg>