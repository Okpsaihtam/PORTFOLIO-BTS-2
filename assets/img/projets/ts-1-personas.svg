<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Trois personas : technicienne support, manager IT et employée demandeuse">
<title>Trois personas : technicienne support, manager IT et employée demandeuse</title>
<rect width="1200" height="750" fill="#f1f5f9"/>
<text x="60" y="70" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start">Recherche utilisateur : 3 personas</text><text x="60" y="102" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">Construits à partir d&#x27;entretiens avec 5 techniciens support</text><rect x="60" y="150" width="340" height="540" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><circle cx="230" cy="245" r="60" fill="#dbeafe"/><circle cx="230" cy="228" r="22" fill="#2563eb"/><path d="M192 0" /><path d="M188 290 a42 36 0 0 1 84 0 z" fill="#2563eb"/><text x="230" y="345" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Julie, 32 ans</text><text x="230" y="372" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#2563eb" text-anchor="middle">Technicienne support</text><text x="90" y="420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="start">Contexte</text><text x="90" y="450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Traite 25 tickets / jour</text><text x="90" y="478" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Perd du temps à chercher</text><text x="90" y="506" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">l&#x27;historique d&#x27;un poste</text><rect x="80" y="560" width="300" height="104" rx="10" fill="#dbeafe"/><text x="230" y="598" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">« Je veux voir tout de suite</text><text x="230" y="624" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">ce qui est urgent. »</text><rect x="430" y="150" width="340" height="540" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><circle cx="600" cy="245" r="60" fill="#ede9fe"/><circle cx="600" cy="228" r="22" fill="#7c3aed"/><path d="M562 0" /><path d="M558 290 a42 36 0 0 1 84 0 z" fill="#7c3aed"/><text x="600" y="345" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Karim, 45 ans</text><text x="600" y="372" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7c3aed" text-anchor="middle">Manager IT</text><text x="460" y="420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="start">Contexte</text><text x="460" y="450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Pilote une équipe de 6</text><text x="460" y="478" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Suit les délais de résolution</text><text x="460" y="506" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Rend des comptes à la DSI</text><rect x="450" y="560" width="300" height="104" rx="10" fill="#ede9fe"/><text x="600" y="598" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">« J&#x27;ai besoin d&#x27;une vue</text><text x="600" y="624" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">d&#x27;ensemble fiable. »</text><rect x="800" y="150" width="340" height="540" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><circle cx="970" cy="245" r="60" fill="#dcfce7"/><circle cx="970" cy="228" r="22" fill="#15803d"/><path d="M932 0" /><path d="M928 290 a42 36 0 0 1 84 0 z" fill="#15803d"/><text x="970" y="345" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Sophie, 28 ans</text><text x="970" y="372" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#15803d" text-anchor="middle">Employée (demandeuse)</text><text x="830" y="420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="start">Contexte</text><text x="830" y="450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Déclare 2 à 3 pannes / mois</text><text x="830" y="478" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Ne connaît pas le jargon</text><text x="830" y="506" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Veut suivre sa demande</text><rect x="820" y="560" width="300" height="104" rx="10" fill="#dcfce7"/><text x="970" y="598" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">« Je ne sais jamais où en</text><text x="970" y="624" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">est mon ticket. »</text>
</svg>