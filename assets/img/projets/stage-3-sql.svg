<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Optimisation Eloquent : passage de 26 requêtes à 2 grâce au chargement anticipé">
<title>Optimisation Eloquent : passage de 26 requêtes à 2 grâce au chargement anticipé</title>
<rect width="1200" height="750" fill="#e8eeeb"/>
<g><rect x="60" y="40" width="1080" height="670" rx="14" fill="#0f172a" stroke="#cbd5d1" stroke-width="1.5"/><path d="M60 54 a14 14 0 0 1 14 -14 h1052 a14 14 0 0 1 14 14 v30 h-1080 z" fill="#1f2937"/><circle cx="84" cy="62" r="6" fill="#ef4444"/><circle cx="104" cy="62" r="6" fill="#f59e0b"/><circle cx="124" cy="62" r="6" fill="#22c55e"/><text x="600.0" y="67" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">UserController.php — avant / après</text></g><text x="100" y="125" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fca5a5" text-anchor="start">AVANT : une requête par utilisateur (problème N+1)</text><text x="100" y="165" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0">$users </tspan><tspan fill="#c4b5fd">= </tspan><tspan fill="#7dd3fc">User</tspan><tspan fill="#e2e8f0">::all();</tspan></text><text x="100" y="197" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#c4b5fd">foreach </tspan><tspan fill="#e2e8f0">($users </tspan><tspan fill="#c4b5fd">as </tspan><tspan fill="#e2e8f0">$user) {</tspan></text><text x="100" y="229" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#c4b5fd">    echo </tspan><tspan fill="#e2e8f0">$user-&gt;role-&gt;name;  </tspan><tspan fill="#94a3b8">// +1 requête à chaque tour</tspan></text><text x="100" y="261" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0">}</tspan></text><line x1="100" y1="315" x2="1100" y2="315" stroke="#334155"/><text x="100" y="355" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#86efac" text-anchor="start">APRÈS : chargement anticipé + pagination</text><text x="100" y="395" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0">$users </tspan><tspan fill="#c4b5fd">= </tspan><tspan fill="#7dd3fc">User</tspan><tspan fill="#e2e8f0">::with(</tspan><tspan fill="#86efac">&#x27;role&#x27;</tspan><tspan fill="#e2e8f0">)</tspan></text><text x="100" y="427" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0">    -&gt;select(</tspan><tspan fill="#86efac">[&#x27;id&#x27;, &#x27;name&#x27;, &#x27;email&#x27;, &#x27;role_id&#x27;, &#x27;active&#x27;]</tspan><tspan fill="#e2e8f0">)</tspan></text><text x="100" y="459" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0">    -&gt;orderBy(</tspan><tspan fill="#86efac">&#x27;name&#x27;</tspan><tspan fill="#e2e8f0">)</tspan></text><text x="100" y="491" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="18" xml:space="preserve"><tspan fill="#e2e8f0">    -&gt;paginate(</tspan><tspan fill="#fdba74">25</tspan><tspan fill="#e2e8f0">);  </tspan><tspan fill="#94a3b8">// 2 requêtes au total</tspan></text><rect x="100" y="560" width="1000" height="110" rx="10" fill="#1e293b"/><text x="130" y="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start">Requêtes SQL pour afficher 25 comptes</text><text x="130" y="640" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="30" font-weight="800" fill="#86efac" text-anchor="start">26  →  2</text><text x="560" y="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start">Colonnes chargées</text><text x="560" y="640" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="30" font-weight="800" fill="#86efac" text-anchor="start">toutes  →  5</text>
</svg>